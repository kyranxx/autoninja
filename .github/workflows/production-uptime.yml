name: Production Uptime

on:
  schedule:
    # Hourly: useful early warning during development without wasting Actions minutes.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: production-uptime
  cancel-in-progress: false

jobs:
  probe:
    name: Check AutoNinja SK and RO
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify public health endpoints
        shell: bash
        run: |
          set -euo pipefail

          check_market() {
            local market="$1"
            local base_url="$2"
            local health_url="${base_url}/api/health"
            local response=""
            local status=""

            for attempt in 1 2 3; do
              if response="$(curl --fail --show-error --silent --max-time 15 "$health_url")"; then
                status="$(printf '%s' "$response" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status", ""))' 2>/dev/null || true)"
                if [[ "$status" == "healthy" ]]; then
                  echo "$market is healthy."
                  return 0
                fi

                if [[ -z "$status" ]]; then
                  echo "::error::$market health endpoint returned invalid JSON."
                else
                  echo "::warning::$market returned status '$status'."
                fi
              else
                echo "::warning::$market health request failed (attempt $attempt/3)."
              fi

              if [[ "$attempt" != "3" ]]; then
                sleep 15
              fi
            done

            echo "::error::$market did not become healthy after three attempts."
            return 1
          }

          check_market "AutoNinja SK" "https://www.autoninja.sk"
          check_market "AutoNinja RO" "https://www.autoninja.ro"
